name: GitHub release
# Push a tag vX.Y.Z: the BigWigs packager builds the zip and makes the GitHub Release. Nothing goes to CurseForge.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
