name: CurseForge upload
# Separate from the GitHub release: push a tag cf-vX.Y.Z on the same commit as vX.Y.Z, and that same build goes to
# CurseForge. Needs the repository variable CURSEFORGE_PROJECT_ID and the secret CF_API_TOKEN.
on:
  push:
    tags: ["cf-v*"]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use the release tag on this commit
        run: |
          cf="$GITHUB_REF_NAME"; v="${cf#cf-}"
          git tag -d "$cf"
          test "$(git rev-list -n 1 "$v")" = "$(git rev-parse HEAD)" || { echo "Tag $v must be on this commit"; exit 1; }
      - uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
